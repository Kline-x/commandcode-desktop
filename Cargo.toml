[workspace]
resolver = "2"
members = ["crates/*"]

# 共享的编译产物目录；.gitignore 已忽略 /target
[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/Kline-x/commandcode-desktop"

[workspace.dependencies]
# 依赖在此集中声明，Phase 1 起由各 crate 按需启用（见 docs/PLAN.md 第 4 节）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# 全仓库共享的 lint 策略。各 crate 用 [lints] workspace = true 继承。
# 新增 allow 必须在此写明理由（见 docs/STYLE.md）。
[workspace.lints.clippy]
# 协议层的 JSON 形状差异大，Box 化大枚举变体的可读性代价高于收益
large_enum_variant = "allow"
# 文档中的中文标点不影响正确性
doc_markdown = "allow"
# 上下游协议里大量 &String 参数沿用既有签名，避免无意义的破坏性改动
ptr_arg = "allow"

[workspace.lints.rust]
# unsafe 需要显式理由（本项目预期为 0 处）
unsafe_code = "warn"
