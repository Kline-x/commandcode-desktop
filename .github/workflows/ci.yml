name: CI

# 仓库为**公开**，标准 GitHub-hosted runner 免费且不计分钟数，
# 因此这里不再需要"只在 Linux 上跑"的成本优化——只是核心 crate 本身就
# 与平台无关（不依赖 webkit2gtk），在 Linux 上跑最快而已。
# 三平台完整构建仍在 release.yml 中由 tag / 手动触发。
#
# 本工作流的检查集合与 scripts/check.sh 一致——两者是同一套标准，不要各写一套。

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'third_party/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'third_party/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Read toolchain channel
        id: toolchain
        run: |
          channel=$(grep -oE 'channel[[:space:]]*=[[:space:]]*"[^"]+"' rust-toolchain.toml | head -1 | cut -d'"' -f2)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # 只检查 cc-server：它是平台无关的核心逻辑，不依赖 webkit2gtk，
      # 因此在 Linux runner 上秒级完成。src-tauri 需要系统 WebKit 依赖，
      # 不进日常 CI（由 release.yml 在三平台各自构建）。
      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy -p cc-server --all-targets -- -D warnings

      - name: test
        run: cargo test -p cc-server

      - name: typos
        uses: crate-ci/typos@master
        with:
          config: ./typos.toml

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
