name: CI

# 成本策略（私有仓库计费）：日常 CI **只在 Linux 上跑核心 crate**。
# GitHub Actions 在私有仓库消耗账户额度，macOS runner 的计费系数是 Linux 的 10 倍，
# Windows 是 2 倍。完整三平台构建只在打 tag / 手动触发时进行（见 release.yml）。
# 详见 docs/PLAN.md 第 15 节。

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'third_party/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'third_party/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Read toolchain channel
        id: toolchain
        run: |
          channel=$(grep -oE 'channel[[:space:]]*=[[:space:]]*"[^"]+"' rust-toolchain.toml | head -1 | cut -d'"' -f2)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # 只检查 cc-server：它是平台无关的核心逻辑，不依赖 webkit2gtk，
      # 因此在 Linux runner 上秒级完成。src-tauri 需要系统 WebKit 依赖，
      # 不进日常 CI（由 release.yml 在三平台各自构建）。
      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy -p cc-server --all-targets -- -D warnings

      - name: test
        run: cargo test -p cc-server
