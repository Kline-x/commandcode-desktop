name: CI

# 仓库为**公开**，标准 GitHub-hosted runner 免费且不计分钟数，
# 因此这里不再需要"只在 Linux 上跑"的成本优化——只是核心 crate 本身就
# 与平台无关（不依赖 webkit2gtk），在 Linux 上跑最快而已。
# 三平台完整构建仍在 release.yml 中由 tag / 手动触发。
#
# 本工作流的检查集合与 scripts/check.sh 一致——两者是同一套标准，不要各写一套。

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'third_party/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'third_party/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Read toolchain channel
        id: toolchain
        run: |
          channel=$(grep -oE 'channel[[:space:]]*=[[:space:]]*"[^"]+"' rust-toolchain.toml | head -1 | cut -d'"' -f2)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # 只检查 cc-server：它是平台无关的核心逻辑，不依赖 webkit2gtk，
      # 因此在 Linux runner 上秒级完成。src-tauri 需要系统 WebKit 依赖，
      # 不进日常 CI（由 release.yml 在三平台各自构建）。
      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy -p cc-server --all-targets -- -D warnings

      - name: test
        run: cargo test -p cc-server

      - name: typos
        uses: crate-ci/typos@master
        with:
          config: ./typos.toml

      # 通配版本防护。
      #
      # cargo-deny 的 wildcards 检查会把 workspace 内的 path 依赖也算作
      # wildcard（它没有 version 字段），对单 workspace 项目是误报，所以
      # deny.toml 里那项设为 allow，改用这里显式检查「有没有 "*" 版本」。
      - name: 禁止通配版本
        run: |
          if grep -rnE '^[a-zA-Z0-9_-]+ *= *"[*]"' --include=Cargo.toml .; then
            echo "::error::发现通配版本依赖（"*"）；请写明确版本或改用 workspace 依赖"
            exit 1
          fi
          echo "未发现通配版本"

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  # 前端单独一个 job：Node 与 Rust 工具链互不依赖，并行跑更快。
  # 之前 CI 只查 Rust，前端类型错误要等到打包时才发现。
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 类型检查：strict 模式下的类型错误必须在合并前拦住
      - name: typecheck
        run: pnpm exec tsc --noEmit

      # 生产构建：顺带验证 vite 配置与依赖解析
      - name: build
        run: pnpm exec vite build
