[package]
name = "commandcode-desktop"
description = "Command Code 桌面客户端：多账号轮换代理 + 实时用量面板"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
# Tauri 需要库目标以便移动端复用；桌面端只用 bin
name = "commandcode_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 核心逻辑全部在 cc-server 里（平台无关，可在 Linux CI 独立测试）
axum = "0.8"
cc-server = { path = "../crates/cc-server" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
thiserror.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
