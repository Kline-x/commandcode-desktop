[package]
name = "commandcode-desktop"
description = "Command Code 桌面客户端：多账号轮换代理 + 实时用量面板"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
# Tauri 需要库目标以便移动端复用；桌面端只用 bin
name = "commandcode_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 核心逻辑全部在 cc-server 里（平台无关，可在 Linux CI 独立测试）
axum = "0.8"
cc-server = { path = "../crates/cc-server" }
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
# 账号密钥的加密：AES-256-GCM（认证加密，防篡改）
aes-gcm = "0.10"
# 主密钥派生：主密钥本身存在系统钥匙串，不需口令派生，故只用 sha2 做 KDF 混合
sha2 = "0.10"
# 系统钥匙串（macOS Keychain / Windows Credential Manager / Linux Secret Service）
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
thiserror.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
